name: UniversalLauncher
options:
  bundleIdPrefix: com.universallauncher
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  UniversalLauncher:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universallauncher.ios
        INFOPLIST_KEY_CFBundleDisplayName: Universal Launcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
