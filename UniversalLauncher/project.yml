name: UniversalLauncher
options:
  bundleIdPrefix: com.universallauncher
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  UniversalLauncher:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universallauncher.ios
        INFOPLIST_KEY_CFBundleDisplayName: Universal Launcher
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
