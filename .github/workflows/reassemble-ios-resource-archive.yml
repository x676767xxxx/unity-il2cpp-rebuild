name: Reassemble and verify uploaded iOS resource archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download, verify and append Release parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          base="https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/IOS_202408202213.6.zip"
          : > IOS_202408202213.6.zip

          fetch_append() {
            suffix="$1"
            expected_size="$2"
            expected_sha="$3"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 "${base}.${suffix}" -o "part.${suffix}"
            test "$(stat -c %s "part.${suffix}")" = "$expected_size"
            echo "$expected_sha  part.${suffix}" | sha256sum -c -
            cat "part.${suffix}" >> IOS_202408202213.6.zip
            rm "part.${suffix}"
          }

          fetch_append 001 1500000000 adaf740e114536f299ffcf0cfd0e7b2e4f28d189973db1a4674a97973d8e0b11
          fetch_append 002 1500000000 2a1def1b76590b4dc626f0d234669f31f44f1f8080a24b3f9250d3140a6bee6b
          fetch_append 003 1500000000 03940b5e472f7e4a8af3f4650c960de7710e686af73070dd4a3c55be9bffc34f
          fetch_append 004 1238046419 e193d0e3273afe22e5b127701f95be1d6aa4883aa64480febc47da5adc93b18e

          test "$(stat -c %s IOS_202408202213.6.zip)" = 5738046419
          echo "Reassembled bytes: $(stat -c %s IOS_202408202213.6.zip)" | tee ../reassembly-report.txt
          sha256sum IOS_202408202213.6.zip | tee -a ../reassembly-report.txt

      - name: Test ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq work/IOS_202408202213.6.zip
          echo "ZIP integrity: PASS" | tee -a reassembly-report.txt

      - name: Inventory archive contents
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, collections, os
          p = "work/IOS_202408202213.6.zip"
          with zipfile.ZipFile(p) as z:
              infos = z.infolist()
              counts = collections.Counter(os.path.splitext(i.filename)[1].lower() or "[no extension]" for i in infos)
              bundles = [i for i in infos if i.filename.lower().endswith(".bundle")]
              with open("archive-inventory.txt", "w", encoding="utf-8") as f:
                  f.write(f"Entries: {len(infos)}\n")
                  f.write(f"Total uncompressed bytes: {sum(i.file_size for i in infos)}\n")
                  f.write(f"Bundle entries: {len(bundles)}\n\n")
                  f.write("Extension counts:\n")
                  for ext, n in counts.most_common():
                      f.write(f"{ext}: {n}\n")
                  f.write("\nLargest 100 entries:\n")
                  for i in sorted(infos, key=lambda x: x.file_size, reverse=True)[:100]:
                      f.write(f"{i.file_size}\t{i.filename}\n")
          print(f"Archive entries: {len(infos)}; bundle entries: {len(bundles)}")
          PY

      - name: Analyze catalog, catalog differences and bundle mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, json, os, hashlib, re, collections
          p = "work/IOS_202408202213.6.zip"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              bundle_names = [n for n in names if n.lower().endswith(".bundle")]
              bundle_base = {os.path.basename(n).lower(): n for n in bundle_names}
              catalog_names = sorted(n for n in names if os.path.basename(n).lower().startswith("catalog_") and n.lower().endswith(".json"))
              catalogs = []
              with open("metadata-analysis.txt", "w", encoding="utf-8") as report:
                  report.write("CATALOG METADATA AND COMPARISON\\n")
                  report.write(f"Archive bundle entries: {len(bundle_names)}\\n")
                  for n in catalog_names:
                      raw = z.read(n)
                      obj = json.loads(raw.decode("utf-8-sig"))
                      ids = obj.get("m_InternalIds", [])
                      id_set = set(x for x in ids if isinstance(x, str))
                      catalogs.append((n, obj, id_set))
                      report.write(f"\\nFILE: {n}\\nSIZE: {len(raw)} bytes\\nSHA256: {hashlib.sha256(raw).hexdigest()}\\n")
                      report.write(f"LocatorId: {obj.get('m_LocatorId')}\\nBuildResultHash: {obj.get('m_BuildResultHash')}\\n")
                      report.write(f"ProviderIds ({len(obj.get('m_ProviderIds', []))}): {obj.get('m_ProviderIds')}\\n")
                      report.write(f"InternalIds: {len(ids)} entries; {len(id_set)} unique strings\\n")
                      report.write(f"ResourceTypes: {len(obj.get('m_resourceTypes', []))} entries\\n")
                      for key in ("m_KeyDataString", "m_BucketDataString", "m_EntryDataString", "m_ExtraDataString"):
                          value = obj.get(key, "")
                          report.write(f"{key}: type={type(value).__name__}, encoded_chars={len(value) if isinstance(value, str) else 'n/a'}\\n")
                      basenames = [os.path.basename(x.split("?",1)[0]).lower() for x in ids if isinstance(x,str) and x.lower().endswith(".bundle")]
                      matched = [x for x in basenames if x in bundle_base]
                      unmatched = sorted(set(x for x in basenames if x not in bundle_base))
                      report.write(f"InternalId bundle references: {len(basenames)}; matched archive basenames: {len(set(matched))}; unmatched unique basenames: {len(unmatched)}\\n")
                      if unmatched:
                          report.write("UNMATCHED BUNDLE ID BASENAMES (first 100):\\n")
                          report.write("\\n".join(unmatched[:100]) + "\\n")
                      report.write("FIRST 12 INTERNAL IDS:\\n")
                      report.write("\\n".join(str(x) for x in ids[:12]) + "\\n")
                  report.write("\\nCATALOG-TO-CATALOG INTERNAL ID DIFFERENCES\\n")
                  for i in range(1, len(catalogs)):
                      prev_name, _, prev = catalogs[i-1]
                      cur_name, _, cur = catalogs[i]
                      added = sorted(cur-prev)
                      removed = sorted(prev-cur)
                      report.write(f"\\n{prev_name} -> {cur_name}\\n")
                      report.write(f"Added IDs: {len(added)}; removed IDs: {len(removed)}\\n")
                      if added:
                          report.write("ADDED (first 250):\\n" + "\\n".join(added[:250]) + "\\n")
                      if removed:
                          report.write("REMOVED (first 250):\\n" + "\\n".join(removed[:250]) + "\\n")
                  report.write("\\nARCHIVE BUNDLE NAME SAMPLES\\n")
                  report.write("\\n".join(sorted(os.path.basename(x) for x in bundle_names)[:250]) + "\\n")
              # Keep a compact hash/catalog file inventory too.
              with open("metadata-file-hashes.txt", "w", encoding="utf-8") as out:
                  for n in sorted(x for x in names if os.path.splitext(x)[1].lower() in (".json",".hash")):
                      raw=z.read(n)
                      out.write(f"{n}\\t{len(raw)}\\t{hashlib.sha256(raw).hexdigest()}\\n")
          print(f"Analyzed {len(catalog_names)} catalogs and {len(bundle_names)} bundle entries")
          PY

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: ios-resource-archive-verification
          path: |
            reassembly-report.txt
            archive-inventory.txt
            metadata-analysis.txt
            metadata-file-hashes.txt
          if-no-files-found: error
          retention-days: 30
