name: Decompile AzureArchive recovered IL
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decompile-recovered-il.yml"
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Download Cpp2IL recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: azurearchive-cpp2il-recovery-test
          path: work/in/recovery
          repository: x676767xxxx/unity-il2cpp-rebuild
          run-id: 41169615291
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ILSpy command line
        run: dotnet tool install ilspycmd --tool-path work/tools
      - name: Locate assemblies and decompile without stopping on first error
        shell: bash
        run: |
          set +e
          mkdir -p work/out/android work/out/windows
          find work/in/recovery -type f -iname 'Assembly-CSharp.dll' -print | tee work/out/assembly-paths.txt
          A=$(find work/in/recovery -type f -path '*android*' -iname 'Assembly-CSharp.dll' | head -1)
          W=$(find work/in/recovery -type f -path '*windows*' -iname 'Assembly-CSharp.dll' | head -1)
          if [ -z "$A" ]; then A=$(find work/in/recovery -type f -iname 'Assembly-CSharp.dll' | head -1); fi
          if [ -n "$A" ]; then
            echo "ANDROID_ASSEMBLY=$A" > work/out/android-ilspy.log
            work/tools/ilspycmd -o work/out/android "$A" >> work/out/android-ilspy.log 2>&1
            echo "ILSPY_EXIT=$?" >> work/out/android-ilspy.log
          else
            echo "Assembly-CSharp.dll not found" > work/out/android-ilspy.log
          fi
          if [ -n "$W" ]; then
            echo "WINDOWS_ASSEMBLY=$W" > work/out/windows-ilspy.log
            work/tools/ilspycmd -o work/out/windows "$W" >> work/out/windows-ilspy.log 2>&1
            echo "ILSPY_EXIT=$?" >> work/out/windows-ilspy.log
          else
            echo "Windows Assembly-CSharp.dll not found" > work/out/windows-ilspy.log
          fi
          find work/out -type f | sort > work/out/output-files.txt
          exit 0
      - name: Extract target classes and method snippets
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("work/out")
          targets=["ScenarioResourceManager","AuthoringResourceCatalog","CharacterManager","Character","BackgroundResource","ResourceOverrideData","Util","ScenarioBgNameDbSchema","xxHash"]
          report=[]
          for target in targets:
              report.append("\n## "+target)
              for platform in ["android","windows"]:
                  hits=[]
                  for p in (root/platform).rglob("*.cs"):
                      s=p.read_text(errors="ignore")
                      if re.search(r"\b(class|struct)\s+"+re.escape(target)+r"\b",s):
                          hits.append(p)
                  report.append(f"{platform}: "+(", ".join(str(x.relative_to(root/platform)) for x in hits) if hits else "not found"))
                  for p in hits:
                      lines=p.read_text(errors="ignore").splitlines()
                      report.append(f"--- {platform}/{p.name} ---")
                      report.extend(lines[:500])
          (root/"target-source-extracts.txt").write_text("\n".join(report))
          PY
      - name: Upload decompiled source and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-decompiled-source
          path: work/out/
