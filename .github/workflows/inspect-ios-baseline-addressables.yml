name: Inspect legacy iOS IPA Addressables baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-ios-baseline-addressables.yml'

jobs:
  inspect:
    runs-on: macos-latest
    steps:
      - name: Download legacy iOS IPA
        run: |
          set -euo pipefail
          mkdir -p work/ipa work/out
          curl -fL --retry 3 --retry-all-errors \
            -o work/ipa/AzureArchive_IOS_0.7.9.2.ipa \
            "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_IOS_0.7.9.2.ipa"
          unzip -q work/ipa/AzureArchive_IOS_0.7.9.2.ipa -d work/ipa/unpacked
          curl -fL --retry 3 --retry-all-errors \
            -o work/ipa/base.apk \
            "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
      - name: Inventory player and Addressables configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, plistlib, re, subprocess, zipfile
          root=pathlib.Path("work/ipa/unpacked")
          out=pathlib.Path("work/out")
          apps=list((root/"Payload").glob("*.app"))
          if not apps:
              raise SystemExit("Payload/*.app not found in legacy IPA")
          app=apps[0]
          info=plistlib.loads((app/"Info.plist").read_bytes())
          lines=[
            "Legacy IPA baseline: AzureArchive iOS 0.7.9.2",
            f"App bundle: {app.name}",
            f"Bundle identifier: {info.get('CFBundleIdentifier')}",
            f"Bundle version: {info.get('CFBundleVersion')}",
            f"Minimum iOS: {info.get('MinimumOSVersion')}",
            "",
            "Relevant files (Addressables / catalog / streaming assets):"
          ]
          patterns=re.compile(r"(addressable|catalog|streamingassets|settings\.json|\.bundle$|\.hash$|\.bin$)",re.I)
          matches=[]
          for p in app.rglob("*"):
              if p.is_file() and patterns.search(str(p.relative_to(app))):
                  matches.append(p)
          for p in sorted(matches):
              lines.append(f"{p.relative_to(app)}\t{p.stat().st_size}")
          lines += ["", "App executables:"]
          executables=[]
          for p in app.rglob("*"):
              if p.is_file():
                  try:
                      desc=subprocess.run(["file",str(p)],capture_output=True,text=True).stdout.strip()
                  except Exception:
                      desc=""
                  if "Mach-O" in desc:
                      executables.append((p,desc))
                      lines.append(f"{p.relative_to(app)}\t{desc}")
          out.joinpath("ios-addressables-inventory.txt").write_text("\n".join(lines)+"\n")
          # Copy configuration-like files only; keep the executable out of the artifact.
          for i,p in enumerate(matches):
              dest=out/"config"/str(i)/p.name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(p.read_bytes())
          # Compare the Android 1.0 APK's serialized Addressables files against this legacy iOS baseline.
          apk=pathlib.Path("work/ipa/base.apk")
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              selected=[n for n in names if re.search(r"(^|/)(settings\.json|catalog\.json)$",n,re.I)]
              report=["Android 1.0 APK Addressables files:"]
              for n in selected:
                  info=z.getinfo(n)
                  report.append(f"{n}\t{info.file_size}")
                  dest=out/"android-1.0"/pathlib.Path(n).name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(n))
              out.joinpath("android-addressables-inventory.txt").write_text("\n".join(report)+"\n")
              # Scan the Android 1.0 player binaries for embedded runtime URL/domain candidates.
              candidate_names=[n for n in names if (
                  n.endswith("/libil2cpp.so") or n.endswith("/global-metadata.dat") or
                  re.fullmatch(r"classes(?:[0-9]+)?\\.dex", pathlib.Path(n).name) or
                  n.endswith("/libunity.so")
              )]
              url_hits=[]
              for n in candidate_names:
                  dest=pathlib.Path("work/ipa")/("scan_"+pathlib.Path(n).name)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(n) as src, dest.open("wb") as dst:
                      while True:
                          chunk=src.read(8*1024*1024)
                          if not chunk: break
                          dst.write(chunk)
                  for mode in (["-a"],["-el"]):
                      result=subprocess.run(["strings",*mode,str(dest)],capture_output=True,text=True,errors="replace")
                      for line in result.stdout.splitlines():
                          if re.search(r"https?://|(?:[a-z0-9-]+\\.)+[a-z]{2,}",line,re.I):
                              # Avoid leaking query parameters or embedded credentials.
                              safe=re.sub(r"([?&][^=\\s]+)=([^&\\s]+)",r"\\1=<redacted>",line)
                              url_hits.append(f"{n} [{mode[0]}] {safe[:500]}")
                  dest.unlink(missing_ok=True)
              out.joinpath("android-runtime-url-hits.txt").write_text("\n".join(dict.fromkeys(url_hits[:30000]))+"\n")
          # Scan the iOS executable, UnityFramework, and global metadata for runtime URL candidates.
          ios_hits=[]
          scan_files=[p for p in app.rglob("*") if p.is_file() and (
              p.name == "global-metadata.dat" or any(p == exe for exe,_ in executables)
          )]
          for p in scan_files:
              for mode in (["-a"],["-el"]):
                  result=subprocess.run(["strings",*mode,str(p)],capture_output=True,text=True,errors="replace")
                  for line in result.stdout.splitlines():
                      if re.search(r"https?://",line,re.I):
                          safe=re.sub(r"([?&][^=\\s]+)=([^&\\s]+)",r"\\1=<redacted>",line)
                          ios_hits.append(f"{p.relative_to(app)} [{mode[0]}] {safe[:500]}")
          out.joinpath("ios-runtime-url-hits.txt").write_text("\n".join(dict.fromkeys(ios_hits[:30000]))+"\n")
          with out.joinpath("ios-player-string-hits.txt").open("w") as w:
              for p,desc in executables:
                  r=subprocess.run(["strings","-a",str(p)],capture_output=True,text=True,errors="replace")
                  hits=[x for x in r.stdout.splitlines() if re.search(r"https?://|catalog|addressable|streamingassets|\.bundle|\.hash|\.json",x,re.I)]
                  w.write(f"## {p.relative_to(app)}\n")
                  w.write("\n".join(hits[:20000])+"\n")
          PY
      - name: Upload legacy iOS configuration evidence
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-ios-0.7.9.2-addressables-baseline
          path: work/out/
          if-no-files-found: error
