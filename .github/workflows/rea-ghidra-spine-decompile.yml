name: REA Ghidra decompile Android Spine loader

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rea-ghidra-spine-decompile.yml"
      - "scripts/ghidra/PrepareFocusedFunction.java"

permissions:
  contents: read

concurrency:
  group: rea-ghidra-spine-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux Ghidra runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y procps xvfb unzip

      - name: Download and install Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 -o tools/ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          unzip -q tools/ghidra.zip -d tools
          test -x tools/ghidra_12.1.4_PUBLIC/support/analyzeHeadless

      - name: Download Android 1.0 APK and extract native analysis inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/android work/input work/rea
          curl -fL --retry 3 -o work/android/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
          unzip -q work/android/base.apk -d work/android/unpacked
          LIB="$(find work/android/unpacked -type f -path '*/arm64-v8a/libil2cpp.so' -print -quit)"
          METADATA="$(find work/android/unpacked -type f -name global-metadata.dat -print -quit)"
          test -n "$LIB" || { echo "libil2cpp.so not found" >&2; exit 1; }
          test -n "$METADATA" || { echo "global-metadata.dat not found" >&2; exit 1; }
          cp "$LIB" work/input/libil2cpp.so
          cp "$METADATA" work/input/global-metadata.dat
          sha256sum work/input/libil2cpp.so work/input/global-metadata.dat | tee work/rea/input-sha256.txt

      - name: Generate REA IL2CPP method-address evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes rea-agents@6.8.0 inspect-il2cpp-metadata work/input/global-metadata.dat \
            --binary work/input/libil2cpp.so \
            --detail summary \
            --evidence_output work/rea/linked-evidence.json \
            --ghidra-seeds work/input/ghidra-method-seeds.txt \
            --json 2>&1 | tee work/rea/metadata-link.log
          test -s work/input/ghidra-method-seeds.txt

      - name: Extract focused Ghidra pseudocode for Spine loader methods
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
          JAVA_TOOL_OPTIONS: "-Xmx2G -XX:ActiveProcessorCount=2"
        run: |
          set -euo pipefail
          rm -rf work/ghidra-project
          mkdir -p work/ghidra-project
          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/work/ghidra-project" azurearchive-spine \
            -import "$GITHUB_WORKSPACE/work/input/libil2cpp.so" \
            -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/scripts/ghidra" \
            -postScript PrepareFocusedFunction.java \
              0x335f2dc 0x335f32c RuntimeSpineLoader_Load \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-loader-load-ghidra.c" \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-loader-load-ghidra.json" \
            -postScript PrepareFocusedFunction.java \
              0x335f32c 0x335fbdc RuntimeSpineLoader_Create \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-loader-create-ghidra.c" \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-loader-create-ghidra.json" \
            -postScript PrepareFocusedFunction.java \
              0x336004c 0x33601c4 PageTextureLoader_Load \
              "$GITHUB_WORKSPACE/work/rea/page-texture-loader-load-ghidra.c" \
              "$GITHUB_WORKSPACE/work/rea/page-texture-loader-load-ghidra.json" \
            -postScript PrepareFocusedFunction.java \
              0x33601c4 0x33601c8 PageTextureLoader_Unload \
              "$GITHUB_WORKSPACE/work/rea/page-texture-loader-unload-ghidra.c" \
              "$GITHUB_WORKSPACE/work/rea/page-texture-loader-unload-ghidra.json" \
            -postScript PrepareFocusedFunction.java \
              0x335fd1c 0x335ffc8 RuntimeSpineAsset_Dispose \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-asset-dispose-ghidra.c" \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-asset-dispose-ghidra.json" \
            -max-cpu 2 \
            2>&1 | tee work/rea/ghidra-focused-prepare.log
          ls -la work/ghidra-project | tee work/rea/ghidra-project-files.txt
          test -f work/ghidra-project/azurearchive-spine.gpr
          test -d work/ghidra-project/azurearchive-spine.rep
          for stem in \
            runtime-spine-loader-load \
            runtime-spine-loader-create \
            page-texture-loader-load \
            page-texture-loader-unload \
            runtime-spine-asset-dispose; do
            test -s "work/rea/${stem}-ghidra.c"
            test -s "work/rea/${stem}-ghidra.json"
          done

      - name: Verify focused Ghidra pseudocode artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("work/rea")
          targets = [
              ("RuntimeSpineLoader.Load", "0335f2dc", "0335f32c", "runtime-spine-loader-load"),
              ("RuntimeSpineLoader.Create", "0335f32c", "0335fbdc", "runtime-spine-loader-create"),
              ("PageTextureLoader.Load", "0336004c", "033601c4", "page-texture-loader-load"),
              ("PageTextureLoader.Unload", "033601c4", "033601c8", "page-texture-loader-unload"),
              ("RuntimeSpineAsset.Dispose", "0335fd1c", "0335ffc8", "runtime-spine-asset-dispose"),
          ]
          verified = []
          for name, entry, end, stem in targets:
              code_path = root / f"{stem}-ghidra.c"
              meta_path = root / f"{stem}-ghidra.json"
              code = code_path.read_text(encoding="utf-8")
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              digest = hashlib.sha256(code.encode()).hexdigest()
              if not code.strip() or not meta.get("pseudocode_chars"):
                  raise SystemExit(f"{name}: missing non-empty Ghidra pseudocode")
              if meta.get("function_name") != name.replace(".", "_"):
                  raise SystemExit(f"{name}: unexpected function identity {meta.get('function_name')}")
              if meta.get("entry", "").lower() != entry.lower():
                  raise SystemExit(f"{name}: entry mismatch {meta.get('entry')}")
              if int(meta.get("metadata_end_exclusive", "0"), 16) != int(end, 16):
                  raise SystemExit(f"{name}: end-exclusive mismatch {meta.get('metadata_end_exclusive')}")
              if int(meta.get("function_body_min", "0"), 16) < int(entry, 16):
                  raise SystemExit(f"{name}: function body begins before its metadata interval")
              if int(meta.get("function_body_max", "0"), 16) >= int(end, 16):
                  raise SystemExit(f"{name}: function body escapes its metadata interval")
              if meta.get("pseudocode_sha256") != digest or meta.get("pseudocode_chars") != len(code):
                  raise SystemExit(f"{name}: pseudocode hash/length does not match its sidecar")
              if name.replace(".", "_") not in code:
                  raise SystemExit(f"{name}: output does not contain the requested function name")
              verified.append({
                  "target": name,
                  "entry": "0x" + entry,
                  "metadata_end_exclusive": "0x" + end,
                  "instruction_count": meta.get("instruction_count"),
                  "pseudocode_chars": len(code),
                  "pseudocode_sha256": digest,
                  "status": "extracted_and_hash_verified",
                  "limitation": "Metadata-bounded extraction; not proof of complete CFG, out-of-line blocks, or LSDA coverage."
              })
          report = {
              "format": "azurearchive-focused-ghidra-batch-v1",
              "binary_sha256": pathlib.Path("work/rea/input-sha256.txt").read_text().splitlines()[0].split()[0],
              "targets": verified,
              "analysis_mode": "Ghidra 12.1.4 headless import with -noanalysis and focused DecompInterface scripts",
              "not_claimed": ["complete function CFG", "exception/LSDA recovery", "recovered C# source", "Unity project restoration", "iOS Player or IPA"]
          }
          (root / "focused-ghidra-verification.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload REA Ghidra decompilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-rea-ghidra-spine-decompile
          path: work/rea/
          if-no-files-found: warn
