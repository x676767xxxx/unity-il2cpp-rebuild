name: REA Ghidra decompile Android Spine loader

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rea-ghidra-spine-decompile.yml"
      - "scripts/ghidra/PrepareFocusedFunction.java"

permissions:
  contents: read

concurrency:
  group: rea-ghidra-spine-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux Ghidra runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y procps xvfb unzip

      - name: Download and install Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 -o tools/ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          unzip -q tools/ghidra.zip -d tools
          test -x tools/ghidra_12.1.4_PUBLIC/support/analyzeHeadless

      - name: Download Android 1.0 APK and extract native analysis inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/android work/input work/rea
          curl -fL --retry 3 -o work/android/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
          unzip -q work/android/base.apk -d work/android/unpacked
          LIB="$(find work/android/unpacked -type f -path '*/arm64-v8a/libil2cpp.so' -print -quit)"
          METADATA="$(find work/android/unpacked -type f -name global-metadata.dat -print -quit)"
          test -n "$LIB" || { echo "libil2cpp.so not found" >&2; exit 1; }
          test -n "$METADATA" || { echo "global-metadata.dat not found" >&2; exit 1; }
          cp "$LIB" work/input/libil2cpp.so
          cp "$METADATA" work/input/global-metadata.dat
          sha256sum work/input/libil2cpp.so work/input/global-metadata.dat | tee work/rea/input-sha256.txt

      - name: Generate REA IL2CPP method-address evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes rea-agents@6.8.0 inspect-il2cpp-metadata work/input/global-metadata.dat \
            --binary work/input/libil2cpp.so \
            --detail summary \
            --evidence_output work/rea/linked-evidence.json \
            --ghidra-seeds work/input/ghidra-method-seeds.txt \
            --json 2>&1 | tee work/rea/metadata-link.log
          test -s work/input/ghidra-method-seeds.txt

      - name: Prepare focused Ghidra project for RuntimeSpineLoader.Load
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
          JAVA_TOOL_OPTIONS: "-Xmx2G -XX:ActiveProcessorCount=2"
        run: |
          set -euo pipefail
          rm -rf work/ghidra-project
          mkdir -p work/ghidra-project
          "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/work/ghidra-project" azurearchive-spine \
            -import "$GITHUB_WORKSPACE/work/input/libil2cpp.so" \
            -noanalysis \
            -scriptPath "$GITHUB_WORKSPACE/scripts/ghidra" \
            -postScript PrepareFocusedFunction.java \
              0x335f2dc 0x335f32c RuntimeSpineLoader_Load \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-loader-load-ghidra.c" \
              "$GITHUB_WORKSPACE/work/rea/runtime-spine-loader-load-ghidra.json" \
            -max-cpu 2 \
            2>&1 | tee work/rea/ghidra-focused-prepare.log
          ls -la work/ghidra-project | tee work/rea/ghidra-project-files.txt
          test -f work/ghidra-project/azurearchive-spine.gpr
          test -d work/ghidra-project/azurearchive-spine.rep
          test -s work/rea/runtime-spine-loader-load-ghidra.c
          test -s work/rea/runtime-spine-loader-load-ghidra.json

      - name: Check REA Ghidra provider
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
          REA_GHIDRA_PROJECT_PATH: ${{ github.workspace }}/work/ghidra-project/azurearchive-spine.gpr
          REA_GHIDRA_PROGRAM_NAME: libil2cpp.so
          REA_GHIDRA_STARTUP_TIMEOUT_MS: "600000"
        run: |
          set -euo pipefail
          npx --yes rea-agents@6.8.0 doctor --provider ghidra --json | tee work/rea/ghidra-doctor.json

      - name: Decompile RuntimeSpineLoader.Load with REA
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
          REA_GHIDRA_PROJECT_PATH: ${{ github.workspace }}/work/ghidra-project/azurearchive-spine.gpr
          REA_GHIDRA_PROGRAM_NAME: libil2cpp.so
          REA_GHIDRA_STARTUP_TIMEOUT_MS: "600000"
          REA_GHIDRA_DECOMPILE_TIMEOUT_SECONDS: "180"
        run: |
          set -euo pipefail
          npx --yes rea-agents@6.8.0 decompile work/input/libil2cpp.so 0x335f2dc --provider ghidra --json \
            2>&1 | tee work/rea/runtime-spine-loader-load-decompile.json

      - name: Verify actual REA pseudocode was returned
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          source = pathlib.Path("work/rea/runtime-spine-loader-load-decompile.json")
          payload = json.loads(source.read_text(encoding="utf-8"))
          if isinstance(payload, dict) and payload.get("error"):
              raise SystemExit(f"REA returned an error: {payload.get('code')}: {payload.get('message')}")
          pseudocode = payload.get("normalized_result") if isinstance(payload, dict) else None
          if not isinstance(pseudocode, str) or not pseudocode.strip():
              raise SystemExit("REA result has no non-empty normalized_result pseudocode string")
          if "{" not in pseudocode or "}" not in pseudocode:
              raise SystemExit("REA normalized_result does not look like a function body")
          ghidra_code = pathlib.Path("work/rea/runtime-spine-loader-load-ghidra.c").read_text(encoding="utf-8")
          if not ghidra_code.strip():
              raise SystemExit("Focused Ghidra pseudocode file is empty")
          pathlib.Path("work/rea/runtime-spine-loader-load-rea.c").write_text(pseudocode, encoding="utf-8")
          verification = {
              "status": "verified",
              "operation": "procedure_pseudo_code",
              "target": "RuntimeSpineLoader.Load",
              "address": "0x335f2dc",
              "rea_pseudocode_chars": len(pseudocode),
              "rea_pseudocode_sha256": hashlib.sha256(pseudocode.encode()).hexdigest(),
              "focused_ghidra_pseudocode_chars": len(ghidra_code),
              "focused_ghidra_pseudocode_sha256": hashlib.sha256(ghidra_code.encode()).hexdigest(),
              "same_text": pseudocode == ghidra_code,
              "note": "Both outputs are Ghidra-derived pseudocode; equality is recorded, not required."
          }
          pathlib.Path("work/rea/decompile-verification.json").write_text(
              json.dumps(verification, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(verification, indent=2))
          PY

      - name: Upload REA Ghidra decompilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-rea-ghidra-spine-decompile
          path: work/rea/
          if-no-files-found: warn
