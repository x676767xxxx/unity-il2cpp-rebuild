name: Build background path compatibility utility
on:
  workflow_dispatch:
  push:
    paths:
      - "src/AzureArchive.BackgroundCompat/**"
      - "tests/AzureArchive.BackgroundCompat.Tests/**"
      - "src/AzureArchive.UnityCompat/**"
      - "tests/AzureArchive.UnityCompat.Tests/**"
      - ".github/workflows/build-background-path-compat.yml"
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Unity-compatible library
        run: dotnet build src/AzureArchive.BackgroundCompat/AzureArchive.BackgroundCompat.csproj --configuration Release
      - name: Run path safety checks
        run: dotnet run --project tests/AzureArchive.BackgroundCompat.Tests/AzureArchive.BackgroundCompat.Tests.csproj --configuration Release
      - name: Compile and test Unity decoder against isolated API stubs
        run: dotnet run --project tests/AzureArchive.UnityCompat.Tests/AzureArchive.UnityCompat.Tests.csproj --configuration Release
      - name: Upload library output
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-background-path-compat-library
          path: src/AzureArchive.BackgroundCompat/bin/Release/netstandard2.1/
