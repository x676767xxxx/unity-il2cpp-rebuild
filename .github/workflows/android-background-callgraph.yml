name: Android background runtime call graph
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-background-callgraph.yml"
jobs:
  callgraph:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified cross-platform metadata
        uses: actions/download-artifact@v4
        with:
          name: azurearchive-cross-platform-il2cpp-comparison
          path: work/meta
          repository: x676767xxxx/unity-il2cpp-rebuild
          run-id: 41172721121
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Android ARM64 binary
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm unzip
          mkdir -p work/bin work/out
          curl -fL --retry 3 -o work/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
          unzip -p work/base.apk lib/arm64-v8a/libil2cpp.so > work/bin/libil2cpp.so
          test -s work/meta/android/dump.cs
      - name: Build exact method call graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, bisect
          dump=Path("work/meta/android/dump.cs").read_text(errors="replace")
          binary="work/bin/libil2cpp.so"
          out=Path("work/out")
          lines=dump.splitlines()
          rva_to_decl={}
          for i,line in enumerate(lines):
              m=re.search(r'// RVA: 0x([0-9a-fA-F]+)',line)
              if not m: continue
              addr=int(m.group(1),16)
              decl=""
              for j in range(i+1,min(i+8,len(lines))):
                  x=lines[j].strip()
                  if not x or x.startswith("//") or x.startswith("["): continue
                  if "(" in x and (x.endswith("{ }") or x.endswith("{") or x.endswith(";")):
                      decl=x[:260]; break
                  if x.startswith("}") or x.startswith("{"): break
              if decl: rva_to_decl[addr]=decl
          def enclosing_type(index):
              for j in range(index, -1, -1):
                  match = re.search(r'\bclass\s+([^\s:{]+)', lines[j])
                  if match:
                      return match.group(1).rsplit(".", 1)[-1]
              return None
          def find_method(needle, class_name=None):
              for i,line in enumerate(lines):
                  stripped=line.strip()
                  if needle not in line or "(" not in line or stripped.startswith(("[", "//")): continue
                  if class_name and enclosing_type(i) != class_name: continue
                  for j in range(i-1,max(-1,i-6),-1):
                      m=re.search(r'// RVA: 0x([0-9a-fA-F]+)',lines[j])
                      if m: return int(m.group(1),16),stripped
              return None,None
          requested=[
            (" ResolveBackground(","ScenarioResourceManager"),
            (" EnumerateBackgrounds(","ScenarioResourceManager"),
            (" TryGetBackgroundOverridePath(","ScenarioResourceManager"),
            (" AcquireBackgroundSpine(","ScenarioResourceManager"),
            (" GetBackgroundTexture(BackgroundResource","ScenarioResourceManager"),
            (" GetBackgroundPreviewAsync(","ScenarioResourceManager"),
            (" InitializeAuthoringResources(","ScenarioResourceManager"),
            (" GetCustomBgEffect(","ScenarioResourceManager"),
            (" GetBgEffectChoices(","ScenarioResourceManager"),
            (" BackgroundPreviewKey(","ScenarioResourceManager"),
            (" QueueBackgroundPreview(","ScenarioResourceManager"),
            (" DecodeBackgroundImage(","ScenarioResourceManager"),
            (" ResolveOverride(","BackgroundResource"),
            (" GetResourceOverrideRoot(","ScenarioResourceManager"),
            ("g__ReadOverrides|","ScenarioResourceManager"),
            (" TrimBackgroundSkeletonCache(","ScenarioResourceManager"),
            (" Retain(","RuntimeSpineAsset"),
            (" Dispose(","RuntimeSpineAsset"),
            (" Load(","RuntimeSpineLoader"),
            (" Create(","RuntimeSpineLoader"),
            (" Read(","RuntimeSpineLoader"),
            (" ReadAsync(","RuntimeSpineLoader"),
            (" DestroyOwned(","RuntimeSpineLoader"),
            (" AtlasPages(","RuntimeSpineLoader"),
            (" CanLoadPngAsDxt5(","RuntimeSpineLoader"),
            (" Own(","RuntimeSpineAsset"),
            (" get_HasConsumers(","RuntimeSpineAsset"),
            (" get_EstimatedTextureBytes(","RuntimeSpineAsset"),
            (" get_Materials(","RuntimeSpineAsset"),
            (" Load(","PageTextureLoader"),
            (" Unload(","PageTextureLoader"),
            (" <ReadAsync>b__0(","<>c__DisplayClass4_0"),
            (" <Create>b__0(","<>c__DisplayClass6_0"),
          ]
          targets=[]
          report=["# Android ARM64 background runtime call graph","",
                  "Built from the Android 1.0 ARM64 libil2cpp.so and its matching IL2CPP dump.cs. Direct BL edges only; BLR, virtual dispatch, delegates and runtime registration may add edges.",""]
          for needle,cls in requested:
              addr,decl=find_method(needle,cls)
              if addr is None:
                  report.append(f"- NOT FOUND: {cls}.{needle}")
              else:
                  targets.append((addr,cls,needle,decl))
                  report.append(f"- 0x{addr:x}: {cls}.{needle} — {decl}")
          (out/"target-rvas.txt").write_text("\n".join(f"0x{a:x} {c}.{n} {d}" for a,c,n,d in targets))
          # Full disassembly enables caller search by direct BL target.
          dis=subprocess.check_output(["llvm-objdump","-d","--no-show-raw-insn",binary],text=True,errors="replace")
          (out/"full-disassembly.txt").write_text(dis)
          ins=[]
          for line in dis.splitlines():
              m=re.match(r'\s*([0-9a-fA-F]+):\s+.*?\bbl\s+0x([0-9a-fA-F]+)',line)
              if m: ins.append((int(m.group(1),16),int(m.group(2),16),line.strip()))
          known=sorted(rva_to_decl)
          def owner(addr):
              k=bisect.bisect_right(known,addr)-1
              if k<0: return "unknown"
              base=known[k]
              if addr-base>0x20000: return "unknown-nearest"
              return f"0x{base:x} {rva_to_decl[base]}"
          for addr,cls,needle,decl in targets:
              callers=[x for x in ins if x[1]==addr]
              report += ["",f"## {cls}.{needle} @ 0x{addr:x}",f"Declaration: {decl}",f"Direct BL callers: {len(callers)}"]
              for src,dst,line in callers[:100]:
                  report.append(f"- caller 0x{src:x} ({owner(src)})")
              # Disassemble this method up to the next known method RVA.
              k=bisect.bisect_right(known,addr)
              end=known[k] if k<len(known) else addr+0x1000
              if end<=addr or end-addr>0x20000: end=addr+0x2000
              segment=subprocess.check_output(["llvm-objdump","-d","--no-show-raw-insn",f"--start-address=0x{addr:x}",f"--stop-address=0x{end:x}",binary],text=True,errors="replace")
              callees=[]
              for line in segment.splitlines():
                  m=re.search(r'\bbl\s+0x([0-9a-fA-F]+)',line)
                  if m:
                      dst=int(m.group(1),16)
                      callees.append((dst,rva_to_decl.get(dst,"unresolved/native")))
              for dst,name in callees:
                  report.append(f"  - calls 0x{dst:x}: {name}")
          (out/"android-background-callgraph.md").write_text("\n".join(report))
          spine_targets=[x for x in targets if x[1] in ("RuntimeSpineLoader","RuntimeSpineAsset") or x[2].strip().startswith("TrimBackgroundSkeletonCache") or (x[1]=="ScenarioResourceManager" and x[2].strip().startswith("AcquireBackgroundSpine"))]
          asm=["# Android ARM64 Spine runtime lifecycle and loader disassembly","",
               "Method bodies are extracted from the Android 1.0 ARM64 libil2cpp.so using the matching dump.cs RVAs. This is Android evidence only; do not reuse these addresses or instructions on iOS.",""]
          for addr,cls,needle,decl in spine_targets:
              k=bisect.bisect_right(known,addr)
              end=known[k] if k<len(known) else addr+0x1000
              if end<=addr or end-addr>0x20000: end=addr+0x2000
              segment=subprocess.check_output(["llvm-objdump","-d","--no-show-raw-insn",f"--start-address=0x{addr:x}",f"--stop-address=0x{end:x}",binary],text=True,errors="replace")
              asm += [f"## {cls}.{needle.strip()} @ 0x{addr:x}",f"Declaration: {decl}","",segment,""]
          (out/"spine-runtime-method-disassembly.txt").write_text("\n".join(asm))
          PY
      - name: Extract preview coroutine switch-table bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          binary = Path("work/bin/libil2cpp.so").read_bytes()
          if binary[:6] != b"\x7fELF\x02\x01":
              raise SystemExit("Expected ELF64 little-endian Android ARM64 binary")
          shoff = struct.unpack_from("<Q", binary, 40)[0]
          shentsize = struct.unpack_from("<H", binary, 58)[0]
          shnum = struct.unpack_from("<H", binary, 60)[0]
          shstrndx = struct.unpack_from("<H", binary, 62)[0]
          sections = [struct.unpack_from("<IIQQQQIIQQ", binary, shoff + i * shentsize) for i in range(shnum)]
          names_hdr = sections[shstrndx]
          names = binary[names_hdr[4]:names_hdr[4] + names_hdr[5]]
          target, count = 0x13377E6, 6
          for section in sections:
              name_off, _, _, addr, offset, size, *_ = section
              name = names[name_off:names.find(b"\0", name_off)].decode(errors="replace")
              if addr <= target and target + count <= addr + size:
                  file_offset = offset + target - addr
                  table = binary[file_offset:file_offset + count]
                  if len(table) != count:
                      raise SystemExit("Truncated jump-table read")
                  expected = bytes.fromhex("00 5b 55 58 2c a4")
                  if table != expected:
                      raise SystemExit(f"Unexpected jump table bytes: {table.hex(' ')}")
                  Path("work/out/preview-coroutine-state-jumptable.txt").write_text(
                      f"section={name} virtual_address=0x{target:x} file_offset=0x{file_offset:x}\n"
                      f"bytes={table.hex(' ')}\n" +
                      "".join(f"state_{i}: byte=0x{b:02x} target=0x{0x3270F48 + b * 4:x}\n" for i, b in enumerate(table))
                  )
                  break
          else:
              raise SystemExit("Jump table virtual address was not found in any ELF section")
          PY
          llvm-objdump -d --no-show-raw-insn --start-address=0x3270d7c --stop-address=0x3272474 work/bin/libil2cpp.so > work/out/preview-coroutine-movenext.txt
          llvm-objdump -d --no-show-raw-insn --start-address=0x2f2dc8c --stop-address=0x2f2dd10 work/bin/libil2cpp.so > work/out/preview-coroutine-helper-2f2dc8c.txt
          llvm-objdump -d --no-show-raw-insn --start-address=0x3261d74 --stop-address=0x3261e90 work/bin/libil2cpp.so > work/out/preview-coroutine-helper-3261d74.txt
          llvm-objdump -d --no-show-raw-insn --start-address=0x5ad7ad8 --stop-address=0x5ad7b60 work/bin/libil2cpp.so > work/out/preview-coroutine-helper-5ad7ad8.txt
          llvm-objdump -d --no-show-raw-insn --start-address=0x66b9ad8 --stop-address=0x66b9b60 work/bin/libil2cpp.so > work/out/preview-coroutine-helper-66b9ad8.txt
          rm -f work/out/full-disassembly.txt
      - name: Upload call graph
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-android-background-callgraph
          path: work/out/
