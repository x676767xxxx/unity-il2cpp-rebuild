name: Universal Launcher iOS Build

concurrency:
  group: universal-launcher-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/universal-launcher-mvp
    paths:
      - "UniversalLauncher/**"
      - ".github/workflows/universal-launcher-ios.yml"
  pull_request:
    paths:
      - "UniversalLauncher/**"
      - ".github/workflows/universal-launcher-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download AzureArchive APK manifest fixture
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk" \
            --output /tmp/azurearchive-base.apk
          mkdir -p UniversalLauncher/Tests/Fixtures
          unzip -p /tmp/azurearchive-base.apk AndroidManifest.xml > UniversalLauncher/Tests/Fixtures/AzureArchive-AndroidManifest.xml
          test -s UniversalLauncher/Tests/Fixtures/AzureArchive-AndroidManifest.xml
          shasum -a 256 /tmp/azurearchive-base.apk
          ls -lh /tmp/azurearchive-base.apk UniversalLauncher/Tests/Fixtures/AzureArchive-AndroidManifest.xml
      - name: Generate Xcode project
        working-directory: UniversalLauncher
        run: xcodegen generate
      - name: Resolve Swift package dependencies
        working-directory: UniversalLauncher
        run: xcodebuild -resolvePackageDependencies -project UniversalLauncher.xcodeproj -scheme UniversalLauncher
      - name: Build iOS Simulator app
        working-directory: UniversalLauncher
        run: xcodebuild -project UniversalLauncher.xcodeproj -scheme UniversalLauncher -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        timeout-minutes: 25
        working-directory: UniversalLauncher
        run: xcodebuild test -project UniversalLauncher.xcodeproj -scheme UniversalLauncher -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" -parallel-testing-enabled NO -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLauncher-iOS-Simulator
          path: UniversalLauncher/build/Build/Products/Debug-iphonesimulator/UniversalLauncher.app
          if-no-files-found: error
          retention-days: 7
