name: Universal Launcher iOS Build

on:
  push:
    branches:
      - feature/universal-launcher-mvp
    paths:
      - "UniversalLauncher/**"
      - ".github/workflows/universal-launcher-ios.yml"
  pull_request:
    paths:
      - "UniversalLauncher/**"
      - ".github/workflows/universal-launcher-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: UniversalLauncher
        run: xcodegen generate
      - name: Resolve Swift package dependencies
        working-directory: UniversalLauncher
        run: xcodebuild -resolvePackageDependencies -project UniversalLauncher.xcodeproj -scheme UniversalLauncher
      - name: Build iOS Simulator app
        working-directory: UniversalLauncher
        run: xcodebuild -project UniversalLauncher.xcodeproj -scheme UniversalLauncher -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests\n        working-directory: UniversalLauncher\n        run: xcodebuild test -project UniversalLauncher.xcodeproj -scheme UniversalLauncher -destination "platform=iOS Simulator,name=iPhone 16" -derivedDataPath build CODE_SIGNING_ALLOWED=NO\n      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLauncher-iOS-Simulator
          path: UniversalLauncher/build/Build/Products/Debug-iphonesimulator/UniversalLauncher.app
          if-no-files-found: error
          retention-days: 7
