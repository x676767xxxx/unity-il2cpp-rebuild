name: Android native method disassembly
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-native-disassembly.yml'
jobs:
  disassemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download IL2CPP dump artifact
        uses: actions/download-artifact@v4
        with:
          name: azurearchive-ios-il2cpp-comparison
          path: work/in/dump
          repository: x676767xxxx/unity-il2cpp-rebuild
          run-id: 41169040171
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Android 1.0 APK
        run: |
          mkdir -p work/android work/out
          curl -fL --retry 3 -o work/android/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
          unzip -p work/android/base.apk lib/arm64-v8a/libil2cpp.so > work/android/libil2cpp.so
          file work/android/libil2cpp.so
      - name: Install LLVM disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
      - name: Disassemble selected 1.0 ARM64 methods
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          dump=pathlib.Path("work/in/dump/dump-android-arm64/dump.cs")
          if not dump.exists():
              candidates=list(pathlib.Path("work/in/dump").rglob("dump.cs"))
              if not candidates: raise SystemExit("dump.cs missing in downloaded artifact")
              dump=candidates[0]
          text=dump.read_text(errors="ignore")
          binary="work/android/libil2cpp.so"
          # RVAs below were verified against the exact method declaration in dump.cs.
          targets=[
            ("ScenarioResourceManager.InitializeAuthoringResources","InitializeAuthoringResources(string databasePath",0x3264CA8),
            ("ScenarioResourceManager.CheckForUpdate","CheckForUpdate()",0x32646B0),
            ("ScenarioResourceManager.Awake","Awake()",0x3264724),
            ("ScenarioResourceManager.InitializeAfterSplash","InitializeAfterSplash()",0x326498C),
            ("ScenarioResourceManager.CheckForUpdate.MoveNext","private bool MoveNext()",0x326FDF0),
            ("ScenarioResourceManager.InitializeAfterSplash.MoveNext","private bool MoveNext()",0x32771DC),
            ("ScenarioResourceManager.OnUpdateComplete.MoveNext","private bool MoveNext()",0x3277420),
            ("ScenarioResourceManager.Initialize","Initialize()",0x3264A00),
            ("ScenarioResourceManager.UpdateAddressable","UpdateAddressable()",0x3265514),
            ("ScenarioResourceManager.LoadGlobalResourceOverrides","LoadGlobalResourceOverrides()",0x326A4F8),
                        ("ScenarioResourceManager.ctor",".ctor()",0x326B90C),
                        ("ScenarioResourceManager.SetFileManifest","SetFileManifest(FileNameInfo manifest)",0x3264F9C),
                        ("ScenarioResourceManager.ManualInstall","ManualInstall(Action onCancel)",0x3264388),
                        ("ScenarioResourceManager.InitializeAuthoringResources","InitializeAuthoringResources(string databasePath, string fileNamesPath, string bgmInfoPath)",0x3264CA8),
                        ("UserSettings.ReadUserSettings.MoveNext","private bool MoveNext()",0x3289908),
                        ("UIPatchDownload.CoChangeSource.MoveNext","private bool MoveNext()",0x3285C5C),
            ("UIPatchDownload.CoChangeSource.SubmitSource","internal void <CoChangeSource>b__13_1(string source)",0x3285AB0),
            ("UserSettings.WriteUserSettings","public void WriteUserSettings()",0x3284FB0),
            ("UserSettings.InitializeSettings","private IEnumerator InitializeSettings()",0x3287388),
            ("UserSettings.InitTask.MoveNext","private bool MoveNext()",0x32894A0),
            ("UserSettings.InitializeSettings.MoveNext","private bool MoveNext()",0x3289750),
            ("UserSettings.ReadUserSettings.MoveNext","private bool MoveNext()",0x3289908),
            ("UserSettings.SettingData.Deserialize","public static UserSettings.SettingData Deserialize(string json)",0x3286854),
            ("ScenarioResourceManager.InitializeAfterSplash.MoveNext","private bool MoveNext()",0x32771DC),
            ("UserSettings.SettingData.set_catalogUrlOverride","public void set_catalogUrlOverride(string value)",0x3287DAC),
            ("ScenarioResourceManager.Awake","protected override void Awake()",0x3264724),
            ("ScenarioResourceManager.Initialize","public void Initialize()",0x3264A00),
            ("ScenarioResourceManager.UpdateAddressable","public void UpdateAddressable()",0x3265514),
                        ("AuthoringCliHost.Bootstrap","Bootstrap()",0x33838E4),
                        ("AuthoringOfflineResources.TryGetStartupUrl","TryGetStartupUrl(out string url)",0x33C5E00),
                        ("AuthoringOfflineResources.get_IsActive","get_IsActive()",0x33C5D68),
                        ("AuthoringOfflineResources.ValidateDirectory","ValidateDirectory(string root, string runtimeCatalogPath, string runtimeSettingsPath, string persistentPath)",0x33C6320),
                        ("UserSettings.InitializeSettings","InitializeSettings()",0x3287388),
            ("ScenarioResourceManager.GetResourceOverrideRoot","GetResourceOverrideRoot()",0x3265028),
            ("AddressableFlatBufferLoader.Load","Load()",0x326D3A8),
            ("AddressableFlatBufferLoader.LoadAll","LoadAll(Action callback)",0x326D520),
            ("ScenarioResourceManager.OnUpdateComplete.TextAssetCallback","<OnUpdateComplete>b__93_1(AsyncOperationHandle<TextAsset> handle)",0x326BE84),
            ("ScenarioResourceManager.ResolveBackground","ResolveBackground(uint id)",0x3260EE0),
            ("ScenarioResourceManager.GetBackgroundPreviewAsync","GetBackgroundPreviewAsync(BackgroundResource resource",0x3261EA0),
            ("ScenarioResourceManager.GetBackgroundTexture(BackgroundResource)","GetBackgroundTexture(BackgroundResource resource)",0x326172C),
            ("AuthoringResourceCatalog.Search","Search(string kind, string query",0x336A1F0),
            ("AuthoringResourceCatalog.Resolve","Resolve(string resourceId, string expectedKind",0x336B5DC),
            ("AuthoringResourceCatalog.Import","Import(ProjectData project, JObject request",0x3375FE8),
            ("AuthoringResourceCatalog.StageReferencedResources","StageReferencedResources(ProjectData project, string stagingResourcesDir, string expectedCatalogVersion)",0x3372058),
          ]
          all_rvas=sorted({int(x,16) for x in re.findall(r'// RVA: 0x([0-9A-Fa-f]+)',text)})
          report=[]
          for label,needle,start in targets:
              if needle not in text:
                  report.append(f"## {label}\nDECLARATION NOT FOUND: {needle}")
                  continue
              later=[x for x in all_rvas if x>start]
              end=min(later) if later else start+0x500
              end=min(end,start+0x1800)
              p=subprocess.run(["llvm-objdump","-d","--start-address="+hex(start),"--stop-address="+hex(end),binary],capture_output=True,text=True)
              report.append(f"## {label}\nVERIFIED_DECLARATION={needle}\nRVA={hex(start)} end={hex(end)} exit={p.returncode}\n{p.stdout}\n{p.stderr}")
          pathlib.Path("work/out/android-arm64-selected-disassembly.txt").write_text("\n".join(report))
          PY
      - name: Upload disassembly report
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-android-arm64-disassembly-corrected
          path: work/out/
