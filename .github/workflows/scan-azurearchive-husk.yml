name: Scan AzureArchive APK with Husk 3.4

on:
  push:
    branches:
      - integration/husk-runtime-template
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Husk submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply isolated Unity version classification correction
        run: python3 scripts/apply_husk_3_4_unity_version_fix.py

      - name: Install scanner dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev clang lld llvm python3

      - name: Run Husk 3.4 page-layout regression test
        run: |
          set -euo pipefail
          mkdir -p scan
          SRC="Husk/src/translation-layer"
          TESTS="Husk/tests/translation-layer"
          cc -std=gnu11 -O2 -g -Wall -Wextra -Werror -I"$SRC" \
            -o scan/plan_test "$TESTS/plan_test.c" "$SRC/husk-tl-elf.c"
          scan/plan_test

      - name: Download the existing AzureArchive Android 1.0 APK
        run: |
          mkdir -p scan
          curl --fail --location --retry 3 \
            --output scan/base.apk \
            https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk
          actual="$(stat -c %s scan/base.apk)"
          expected="364837539"
          echo "APK bytes: $actual"
          test "$actual" = "$expected"

      - name: Build Husk's own APK scanner
        run: |
          set -euo pipefail
          SRC="Husk/src/translation-layer"
          TESTS="Husk/tests/translation-layer"
          cc -std=gnu11 -O2 -g -Wall -Wextra -Werror -I"$SRC" \
            -o scan/scan_cli "$TESTS/scan_cli.c" \
            "$SRC/husk-tl-json.c" \
            "$SRC/husk-tl-zip.c" \
            "$SRC/husk-tl-elf.c" \
            "$SRC/husk-tl-scan.c" \
            "$SRC/husk-tl-probe.c" \
            -lz -lpthread

      - name: Test version-aware Unity classification with real native libraries
        shell: bash
        run: |
          set -euo pipefail
          scan/scan_cli entry scan/base.apk lib/arm64-v8a/libunity.so 30000000 > scan/libunity.so
          scan/scan_cli entry scan/base.apk lib/arm64-v8a/libil2cpp.so 150000000 > scan/libil2cpp.so
          python3 - <<'PY'
          import struct, zipfile
          from pathlib import Path
          marker = b"UnityPlayerForActivityOrService"
          unity = Path("scan/libunity.so").read_bytes()
          if marker not in unity:
              raise SystemExit("fixture does not carry the Unity 6 heuristic marker")
          il2cpp = Path("scan/libil2cpp.so").read_bytes()
          def make(path, version):
              header = b"UnityFS\\0" + struct.pack(">I", 6) + b"5.x.x\\0" + version.encode() + b"\\0"
              with zipfile.ZipFile(path, "w", zipfile.ZIP_DEFLATED) as z:
                  z.writestr("assets/bin/Data/data.unity3d", header + b"fixture")
                  z.writestr("lib/arm64-v8a/libunity.so", unity)
                  z.writestr("lib/arm64-v8a/libil2cpp.so", il2cpp)
          make("scan/unity-2023.apk", "2023.2.22f1")
          make("scan/unity-6.apk", "6000.0.0f1")
          PY
          scan/scan_cli scan scan/unity-2023.apk > scan/unity-2023.json
          scan/scan_cli scan scan/unity-6.apk > scan/unity-6.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path("scan/unity-2023.json").read_text())
          new = json.loads(Path("scan/unity-6.json").read_text())
          print("Unity 2023 fixture:", old.get("engine"))
          print("Unity 6 fixture:", new.get("engine"))
          if old.get("engine") != "Unity (IL2CPP)":
              raise SystemExit("Unity 2023 fixture was misclassified")
          if new.get("engine") != "Unity 6":
              raise SystemExit("Unity 6 fixture lost its Java-driver classification")
          PY

      - name: Scan APK and summarize runtime compatibility report
        run: |
          set -euo pipefail
          scan/scan_cli scan scan/base.apk > scan/husk-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("scan/husk-report.json").read_text())
          print("ok:", report.get("ok"))
          print("verdict:", report.get("verdict"))
          print("summary:", report.get("summary"))
          print("engine:", report.get("engine"))
          if report.get("engine") != "Unity (IL2CPP)":
              raise SystemExit("Expected Unity 2023.2.22f1 to use the native Unity driver")
          print("ABIs:", report.get("abis"))
          libs = report.get("libraries") or []
          print("native library count:", len(libs))
          for lib in libs:
              print(lib.get("abi"), lib.get("name"),
                    "bytes=", lib.get("bytes"),
                    "status=", lib.get("status"),
                    "notes=", "; ".join(lib.get("notes") or []))
          if not report.get("ok"):
              raise SystemExit("Husk scanner could not parse the APK")
          PY

      - name: Extract Unity version and Unity 6 classification evidence
        shell: bash
        run: |
          set -euo pipefail
          scan/scan_cli entry scan/base.apk lib/arm64-v8a/libunity.so 30000000 > scan/libunity.so
          {
            echo "Unity 6 marker in libunity.so:"
            strings -a scan/libunity.so | grep -F 'UnityPlayerForActivityOrService' | head -10 || true
            echo "Unity version strings in libunity.so:"
            strings -a scan/libunity.so | grep -E '2023\\.2\\.22f1|6000\\.[0-9]+|2023\\.[0-9]+' | head -20 || true
          } | tee scan/unity-evidence.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("scan/base.apk") as z:
              names = [n for n in z.namelist() if n.endswith("/globalgamemanagers") or n == "globalgamemanagers"]
              print("globalgamemanagers entries:", names)
              if names:
                  with z.open(names[0]) as src, open("scan/globalgamemanagers", "wb") as dst:
                      while True:
                          chunk = src.read(1024 * 1024)
                          if not chunk:
                              break
                          dst.write(chunk)
          PY
          if [ -f scan/globalgamemanagers ]; then
            strings -a scan/globalgamemanagers | head -30 | tee -a scan/unity-evidence.txt
          fi

      - name: Check DEX and Unity asset layout
        shell: bash
        run: |
          set -euo pipefail
          echo "DEX entries:"
          unzip -Z1 scan/base.apk | grep -E '(^|/)classes[0-9]*\\.dex$' | tee -a scan/unity-evidence.txt || true
          if unzip -Z1 scan/base.apk | grep -q '^classes.dex$'; then
            scan/scan_cli entry scan/base.apk classes.dex 10000000 > scan/classes.dex
            echo "Unity activity names in classes.dex:" | tee -a scan/unity-evidence.txt
            strings -a scan/classes.dex | grep -E 'UnityPlayer(Activity|ForActivityOrService|ForGameActivity)' | sort -u | tee -a scan/unity-evidence.txt || true
          fi
          echo "Unity-related APK asset paths:" | tee -a scan/unity-evidence.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("scan/base.apk") as z:
              for name in z.namelist():
                  low = name.lower()
                  if "unity" in low or "globalgamemanagers" in low or "boot.config" in low or "il2cpp" in low:
                      print(name)
          PY

      - name: Read Unity bundle header and boot configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a scan/unity-evidence.txt
          import zipfile
          with zipfile.ZipFile("scan/base.apk") as z:
              for name in ("assets/bin/Data/data.unity3d", "assets/bin/Data/boot.config"):
                  try:
                      info = z.getinfo(name)
                  except KeyError:
                      print(name, "not present")
                      continue
                  print(name, "uncompressed_bytes=", info.file_size)
                  with z.open(name) as f:
                      head = f.read(512)
                  print(head.decode("latin1", "replace"))
          PY

      - name: Upload APK scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-husk-3.4-scan
          path: |
            scan/husk-report.json
            scan/unity-evidence.txt
          if-no-files-found: error
          retention-days: 14
