name: Android IL2CPP native target recovery
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-il2cpp-target-recovery.yml"
      - "scripts/extract-il2cpp-targets.py"
      - "scripts/find-srm-static-ctor.py"
      - "scripts/extract-il2cpp-targets.py"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Download and extract Android APK
        run: |
          set -euo pipefail
          mkdir -p work/android work/tools work/out
          curl -fL --retry 3 -o work/android/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
          unzip -q work/android/base.apk -d work/android/unpacked
          LIB="$(find work/android/unpacked -type f -path '*/arm64-v8a/libil2cpp.so' | head -n 1)"
          if [ -z "$LIB" ]; then LIB="$(find work/android/unpacked -type f -name libil2cpp.so | head -n 1)"; fi
          META="$(find work/android/unpacked -type f -name global-metadata.dat | head -n 1)"
          test -n "$LIB"; test -n "$META"
          printf '%s\n' "$LIB" > work/out/libil2cpp-path.txt
          printf '%s\n' "$META" > work/out/global-metadata-path.txt
          sha256sum "$LIB" "$META" > work/out/input-sha256.txt
          file "$LIB" "$META" > work/out/input-file-types.txt
          readelf -h "$LIB" > work/out/il2cpp-elf-header.txt
          find work/android/unpacked -type f -name libil2cpp.so -print > work/out/all-il2cpp-libraries.txt
      - name: Download Il2CppDumper
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o work/tools/Il2CppDumper.zip "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip"
          unzip -q work/tools/Il2CppDumper.zip -d work/tools/dumper
          test -f work/tools/dumper/Il2CppDumper.dll
      - name: Recover IL2CPP metadata and method RVAs
        run: |
          set -uo pipefail
          LIB="$(cat work/out/libil2cpp-path.txt)"
          META="$(cat work/out/global-metadata-path.txt)"
          OUT="$GITHUB_WORKSPACE/work/out/dump"
          mkdir -p "$OUT"
          printf '\n' | script -q -e -c "dotnet \"$GITHUB_WORKSPACE/work/tools/dumper/Il2CppDumper.dll\" \"$GITHUB_WORKSPACE/$LIB\" \"$GITHUB_WORKSPACE/$META\" \"$OUT\"" /dev/null 2>&1 | tee work/out/il2cpp-dumper.log
          STATUS=${PIPESTATUS[1]:-0}
          printf '%s\n' "$STATUS" > work/out/il2cpp-dumper-exit-code.txt
          echo "=== Dumper output tree ===" | tee work/out/dumper-output-tree.txt
          find "$GITHUB_WORKSPACE" -type f \( -name dump.cs -o -name script.json -o -name il2cpp.h -o -name stringliteral.json \) -printf '%p %s bytes\\n' | tee -a work/out/dumper-output-tree.txt
          FOUND="$(find "$GITHUB_WORKSPACE" -type f -name dump.cs -not -path '*/work/out/dump.cs' | head -n 1)"
          if [ -z "$FOUND" ]; then
            echo "dump.cs missing. Dumper output listing:" >&2
            find "$OUT" -maxdepth 3 -printf '%y %p\\n' >&2
            exit 1
          fi
          cp "$FOUND" work/out/dump.cs
          for f in script.json il2cpp.h stringliteral.json; do
            FOUND_FILE="$(find "$GITHUB_WORKSPACE" -type f -name "$f" | head -n 1)"
            if [ -n "$FOUND_FILE" ]; then cp "$FOUND_FILE" "work/out/$f"; fi
          done
          python3 scripts/extract-il2cpp-targets.py work/out work/out/android-il2cpp-targets.json
          echo "Recovered dump.cs from $FOUND"
      - name: Locate ScenarioResourceManager static constructor
        if: success()
        run: python3 scripts/find-srm-static-ctor.py work/out
      - name: Upload Android IL2CPP analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-android-il2cpp-target-recovery
          path: work/out/
