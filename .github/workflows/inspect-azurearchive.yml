name: Inspect AzureArchive release assets
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          mkdir -p inspect
          curl -fL --retry 3 -o inspect/AzureArchive_IOS_0.7.9.2.ipa "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_IOS_0.7.9.2.ipa"
          curl -fL --retry 3 -o inspect/AzureArchive_Win_1.0.1.zip "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_Win_1.0.1.zip"
          curl -fL --retry 3 -o inspect/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
      - name: Extract catalog remote bundle map
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,json,re,collections,hashlib
          files={"iOS":"inspect/AzureArchive_IOS_0.7.9.2.ipa","Android":"inspect/base.apk","Windows":"inspect/AzureArchive_Win_1.0.1.zip"}
          out=[]; catalogs={}
          def add(x=""): out.append(str(x))
          for platform,path in files.items():
            z=zipfile.ZipFile(path); names=z.namelist()
            cn=next((n for n in names if n.endswith("/catalog.json") and "/aa/" in n.lower()),None)
            add("## "+platform)
            if not cn: add("NO CATALOG FOUND"); continue
            raw=z.read(cn); c=json.loads(raw); catalogs[platform]=c
            ids=c.get("m_InternalIds",[])
            add(f"Catalog={cn} bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()}")
            add("InternalIds count="+str(len(ids)))
            for i,x in enumerate(ids):
              if isinstance(x,str) and (x.startswith("http://") or x.startswith("https://")):
                add(f"URL[{i}] {x[:1000]}")
            for key in ("m_ProviderIds","m_ResourceProviderData","m_Keys","m_BucketDataString","m_EntryDataString","m_ExtraDataString","m_KeyDataString"):
              v=c.get(key)
              if isinstance(v,list):
                add(f"{key} count={len(v)}")
                for item in v[:8]: add("  "+repr(item)[:1000])
              elif isinstance(v,str):
                add(f"{key} chars={len(v)} prefix={v[:500]!r}")
              elif v is not None: add(f"{key} type={type(v).__name__} value={repr(v)[:1000]}")
            # Search raw catalog text for CDN and bundle references
            txt=raw.decode("utf-8","replace")
            urls=sorted(set(re.findall(r'https?://[^\\"\\s]+',txt)))
            add("Unique literal URLs="+str(len(urls)))
            for u in urls[:100]: add("  "+u[:1000])
          add("## Catalog pairwise equality")
          for a,b in (("iOS","Android"),("iOS","Windows"),("Android","Windows")):
            if a in catalogs and b in catalogs:
              ca,cb=catalogs[a],catalogs[b]
              add(f"{a} vs {b}:")
              for k in ("m_InternalIds","m_ProviderIds","m_ResourceProviderData","m_Keys","m_BucketDataString","m_EntryDataString","m_ExtraDataString","m_KeyDataString"):
                add(f"  {k}: equal={ca.get(k)==cb.get(k)}")
          pathlib.Path("inspect/catalog-map.txt").write_text("\n".join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: azurearchive-catalog-map
          path: inspect/catalog-map.txt
