name: Inspect AzureArchive release assets
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          mkdir -p inspect
          curl -fL --retry 3 -o inspect/AzureArchive_IOS_0.7.9.2.ipa "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_IOS_0.7.9.2.ipa"
          curl -fL --retry 3 -o inspect/AzureArchive_Win_1.0.1.zip "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_Win_1.0.1.zip"
          curl -fL --retry 3 -o inspect/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
      - name: Compare exact managed assemblies and Addressables catalogs
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,json,collections
          files={"iOS":"inspect/AzureArchive_IOS_0.7.9.2.ipa","Android":"inspect/base.apk","Windows":"inspect/AzureArchive_Win_1.0.1.zip"}
          zs={k:zipfile.ZipFile(v) for k,v in files.items()}
          out=[]; catalogs={}; assemblies={}
          def add(x=""): out.append(str(x))
          for platform,z in zs.items():
            names=z.namelist(); add("## "+platform)
            # Exact hashes for important managed DLLs
            wanted=("Assembly-CSharp.dll","Assembly-CSharp-firstpass.dll","Unity.Addressables.dll","Unity.ResourceManager.dll","BestHTTP.dll","spine-unity.dll","UniTask.dll","UniTask.Addressables.dll")
            assemblies[platform]={}
            for n in names:
              base=n.rsplit("/",1)[-1]
              if base in wanted:
                b=z.read(n); assemblies[platform][base]=hashlib.sha256(b).hexdigest()
                add(f"ASSEMBLY {base} size={len(b)} sha256={assemblies[platform][base]} path={n}")
            # catalog exact semantic hashes
            cn=next((n for n in names if n.endswith("/catalog.json") and "/aa/" in n.lower()),None)
            if cn:
              raw=z.read(cn); c=json.loads(raw); catalogs[platform]=c
              add(f"CATALOG {cn} size={len(raw)} sha256={hashlib.sha256(raw).hexdigest()}")
              add("BuildResultHash="+str(c.get("m_BuildResultHash")))
              for k in ("m_InternalIds","m_KeyDataString","m_BucketDataString","m_EntryDataString","m_ExtraDataString"):
                v=c.get(k)
                if isinstance(v,list): add(f"{k}: count={len(v)} sha256={hashlib.sha256(json.dumps(v,separators=(',',':')).encode()).hexdigest()}")
                elif isinstance(v,str): add(f"{k}: chars={len(v)} sha256={hashlib.sha256(v.encode()).hexdigest()}")
          add("## Pairwise comparisons")
          for a,b in (("iOS","Android"),("iOS","Windows"),("Android","Windows")):
            if a in catalogs and b in catalogs:
              ca,cb=catalogs[a],catalogs[b]
              add(f"CATALOG {a} vs {b}:")
              for k in ("m_BuildResultHash","m_InternalIds","m_KeyDataString","m_BucketDataString","m_EntryDataString","m_ExtraDataString"):
                va,vb=ca.get(k),cb.get(k)
                add(f"  {k}: equal={va==vb} left={len(va) if hasattr(va,'__len__') else va} right={len(vb) if hasattr(vb,'__len__') else vb}")
              ia,ib=ca.get("m_InternalIds",[]),cb.get("m_InternalIds",[])
              sa,sb=set(ia),set(ib)
              add(f"  InternalIds intersection={len(sa&sb)} only_{a}={len(sa-sb)} only_{b}={len(sb-sa)}")
              if sa-sb: add(f"  only_{a} sample={list(sorted(sa-sb))[:20]}")
              if sb-sa: add(f"  only_{b} sample={list(sorted(sb-sa))[:20]}")
            add(f"ASSEMBLIES {a} vs {b}:")
            aa,bb=assemblies[a],assemblies[b]
            for k in sorted(set(aa)|set(bb)):
              if k in aa and k in bb: add(f"  {k}: equal={aa[k]==bb[k]} iOS/left={aa[k][:16]} right={bb[k][:16]}")
              else: add(f"  {k}: missing from {a if k not in aa else b}")
          pathlib.Path("inspect/exact-comparison.txt").write_text("\n".join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: azurearchive-exact-comparison
          path: inspect/exact-comparison.txt
