name: Inspect AzureArchive release assets
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          mkdir -p inspect
          curl -fL --retry 3 -o inspect/AzureArchive_IOS_0.7.9.2.ipa "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_IOS_0.7.9.2.ipa"
          curl -fL --retry 3 -o inspect/AzureArchive_Win_1.0.1.zip "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_Win_1.0.1.zip"
          curl -fL --retry 3 -o inspect/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
      - name: Compare Unity content and addressables
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, json, re
          out=[]
          for p in pathlib.Path("inspect").iterdir():
              if p.suffix.lower() not in ('.ipa','.apk','.zip'): continue
              z=zipfile.ZipFile(p); names=z.namelist()
              out.append(f"## {p.name}")
              for n in names:
                  low=n.lower()
                  if low.endswith(('boot.config','build_info','unity_app_guid','assets/aa/catalog.json','streamingassets/aa/catalog.json','assets/aa/settings.json','streamingassets/aa/settings.json','scriptingassemblies.json')):
                      b=z.read(n)
                      out.append(f"### {n} ({len(b)} bytes) sha256={hashlib.sha256(b).hexdigest()}")
                      if len(b)<200000: out.append(b.decode('utf-8','replace')[:12000])
                      else:
                          try:
                              d=json.loads(b); out.append("JSON top keys: "+str(list(d)[:80]))
                          except: pass
              for n in names:
                  if n.lower().endswith(('data.unity3d','.bundle','.assetbundle')):
                      i=z.getinfo(n); out.append(f"ASSETFILE {n} size={i.file_size}")
                      if i.file_size<300000000:
                          raw=z.read(n)
                          versions=sorted(set(x.decode('ascii','ignore') for x in re.findall(rb'\d{4}\.\d+\.\d+[abfp]?\d*',raw)))
                          if versions: out.append(f"VERSION STRINGS: {versions[:30]}")
                          for pat in (b'UnityFS',b'UnityWeb',b'UnityRaw',b'Addressables',b'AssetBundle'):
                              if pat in raw: out.append(f"MARKER {pat.decode()}: yes")
              for n in names:
                  low=n.lower()
                  if any(x in low for x in ('streamingassets','addressables','assetbundle')) and not low.endswith(('.dll','.pdb')):
                      out.append("RESOURCE "+n)
          pathlib.Path("inspect/resource-report.txt").write_text("\n".join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: azurearchive-resource-comparison
          path: inspect/resource-report.txt
