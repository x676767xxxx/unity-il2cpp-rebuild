name: Inspect exact background resource and preview methods
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-background-method-details.yml"
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download Cpp2IL recovery outputs
        uses: actions/download-artifact@v4
        with:
          name: azurearchive-cpp2il-recovery-test
          path: work/in/recovery
          repository: x676767xxxx/unity-il2cpp-rebuild
          run-id: 41169615291
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ILSpy
        run: dotnet tool install ilspycmd --tool-path work/tools
      - name: Export exact managed types
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out/{android,windows}
          for platform in android windows; do
            root="work/in/recovery/cpp2il-$platform"
            for type in BackgroundResource ScenarioResourceManager; do
              work/tools/ilspycmd --ilcode --type "$type" "$root/Assembly-CSharp.dll" > "work/out/$platform/$type.il" 2> "work/out/$platform/$type.log"
            done
          done
      - name: Extract full exact method bodies and commit report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          targets = [
            ("BackgroundResource", ["ResolveOverride", "Overrides", "ResolvePath", "get_FullPath", "get_CacheKey"]),
            ("ScenarioResourceManager", ["ResolveBackground", "GetBackgroundTexture", "GetBackgroundTextureAsync", "DecodeBackgroundImage", "GetBackgroundPreviewAsync", "QueueBackgroundPreview", "BackgroundPreviewKey", "AcquireBackgroundSpine"])
          ]
          out=Path("work/out")
          report=["# Full exact background method IL (2026-10-31)","","Inputs: Cpp2IL recovered Android 1.0 and Windows 1.0.1 assemblies; ILSpy IL output. Method declaration lines can wrap across lines. This exporter selects exact declaration lines, then captures through the matching end-of-method marker. This is recovered IL, not original C# source.",""]
          for typ,names in targets:
            report.append("## "+typ)
            for platform in ["android","windows"]:
              p=out/platform/f"{typ}.il"
              s=p.read_text(errors="replace")
              lines=s.splitlines()
              report += [f"### {platform} (SHA256 {hashlib.sha256(p.read_bytes()).hexdigest()})"]
              for name in names:
                pattern=re.compile(r"\b"+re.escape(name)+r"\s*\(")
                hits=[i for i,line in enumerate(lines) if pattern.search(line) and ".method" not in line]
                report.append(f"#### {name}: {len(hits)} declarations")
                if not hits:
                  report.append("No exact method declaration found.")
                for i in hits[:6]:
                  start=i
                  while start>0 and i-start<10 and ".method" not in lines[start]:
                    start-=1
                  if ".method" not in lines[start]:
                    report.append("Could not locate .method header for line "+str(i+1))
                    continue
                  # Resolve method name from its end marker. Use the next end-of-method marker belonging to the target type.
                  end=None
                  for j in range(i+1,len(lines)):
                    if "} // end of method "+typ+"::"+name in lines[j]:
                      end=j
                      break
                    if "} // end of class" in lines[j]:
                      break
                  if end is None:
                    report.append("No matching end-of-method marker after declaration at line "+str(i+1))
                    continue
                  fence=chr(96)*3
                  report += [f"Source lines {start+1}-{end+1}:",fence+"il",*lines[start:end+1],fence]
              report.append("")
          report += ["## Guardrails",
            "- Recovered IL may contain NoteDecompilerIssue, invalid-instruction, or unmanaged-memory placeholders. Such regions are not reliable control flow.",
            "- Android and Windows bodies are compared independently; do not merge platform-specific differences.",
            "- The method declaration and call sites are evidence, but do not establish successful runtime behavior on old iOS.",
            "- No C# compatibility code, Unity build, signing, or IPA is produced."]
          Path("analysis/full-exact-background-method-il-2026-10-31.md").write_text("\n".join(report)+"\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/full-exact-background-method-il-2026-10-31.md
          git commit -m "Add full exact background method IL" || echo "No report changes"
          git push
      - name: Upload raw IL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-exact-background-method-il
          path: work/out/
