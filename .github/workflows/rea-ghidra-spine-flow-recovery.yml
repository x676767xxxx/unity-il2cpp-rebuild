name: REA Ghidra recover Spine loader control flow

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rea-ghidra-spine-flow-recovery.yml"
      - "scripts/ghidra/PrepareFlowFunction.java"

permissions:
  contents: read

concurrency:
  group: rea-ghidra-spine-flow-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Ghidra runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y procps xvfb unzip

      - name: Download and install Ghidra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 -o tools/ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          unzip -q tools/ghidra.zip -d tools
          test -x tools/ghidra_12.1.4_PUBLIC/support/analyzeHeadless

      - name: Download Android 1.0 APK and extract IL2CPP inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/android work/input work/rea work/ghidra-project
          curl -fL --retry 3 -o work/android/base.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
          unzip -q work/android/base.apk -d work/android/unpacked
          LIB="$(find work/android/unpacked -type f -path '*/arm64-v8a/libil2cpp.so' -print -quit)"
          METADATA="$(find work/android/unpacked -type f -name global-metadata.dat -print -quit)"
          test -n "$LIB"
          test -n "$METADATA"
          cp "$LIB" work/input/libil2cpp.so
          cp "$METADATA" work/input/global-metadata.dat
          sha256sum work/input/libil2cpp.so work/input/global-metadata.dat | tee work/rea/input-sha256.txt

      - name: Link IL2CPP method pointers with REA
        shell: bash
        run: |
          set -euo pipefail
          npx --yes rea-agents@6.8.0 inspect-il2cpp-metadata work/input/global-metadata.dat \
            --binary work/input/libil2cpp.so \
            --detail summary \
            --evidence_output work/rea/linked-evidence.json \
            --ghidra-seeds work/input/ghidra-method-seeds.txt \
            --json 2>&1 | tee work/rea/metadata-link.log
          test -s work/rea/linked-evidence.json

      - name: Build complete method-entry exclusion list and targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          evidence=json.loads(pathlib.Path("work/rea/linked-evidence.json").read_text())
          result=evidence["records"][0]["normalized_result"]
          addresses=result["method_addresses"]
          entries=[]
          for item in addresses:
              if item.get("state")=="code" and item.get("rva"):
                  entries.append(hex(int(item["rva"],16)+0x100000))
          pathlib.Path("work/input/all-method-entries.txt").write_text("\n".join(entries)+"\n")
          methods=result["methods"]
          types=result["types"]
          targets=[
            (25283,"RuntimeAtlasTexture","TryPngSize","RuntimeAtlasTexture_TryPngSize","runtime-atlas-texture-try-png-size"),
            (25286,"RuntimeAtlasTexture","<TryPngSize>g__Read|19_0","RuntimeAtlasTexture_TryPngSize_Read19_0","runtime-atlas-texture-try-png-size-read-helper"),
            (25270,"RuntimeAtlasTexture","Read","RuntimeAtlasTexture_Read","runtime-atlas-texture-read"),
            (25271,"RuntimeAtlasTexture","Load","RuntimeAtlasTexture_Load","runtime-atlas-texture-load"),
            (25272,"RuntimeAtlasTexture","CreateTexture","RuntimeAtlasTexture_CreateTexture","runtime-atlas-texture-create-texture"),
            (25273,"RuntimeAtlasTexture","DestroyTexture","RuntimeAtlasTexture_DestroyTexture","runtime-atlas-texture-destroy-texture"),
            (25274,"RuntimeAtlasTexture","TryReadCache","RuntimeAtlasTexture_TryReadCache","runtime-atlas-texture-try-read-cache"),
            (25275,"RuntimeAtlasTexture","QueueWrite","RuntimeAtlasTexture_QueueWrite","runtime-atlas-texture-queue-write"),
            (25276,"RuntimeAtlasTexture","WriteCache","RuntimeAtlasTexture_WriteCache","runtime-atlas-texture-write-cache"),
            (25277,"RuntimeAtlasTexture","IsCacheFileError","RuntimeAtlasTexture_IsCacheFileError","runtime-atlas-texture-cache-file-error"),
            (25278,"RuntimeAtlasTexture","Checksum","RuntimeAtlasTexture_Checksum","runtime-atlas-texture-checksum"),
            (25279,"RuntimeAtlasTexture","ReadChecksum","RuntimeAtlasTexture_ReadChecksum","runtime-atlas-texture-read-checksum"),
            (25280,"RuntimeAtlasTexture","FinishPendingWritesAsync","RuntimeAtlasTexture_FinishPendingWritesAsync","runtime-atlas-texture-finish-pending-writes"),
            (25281,"RuntimeAtlasTexture","CanLoadPngAsDxt5","RuntimeAtlasTexture_CanLoadPngAsDxt5","runtime-atlas-texture-can-load-png-dxt5"),
            (25282,"RuntimeAtlasTexture","DxtBytes","RuntimeAtlasTexture_DxtBytes","runtime-atlas-texture-dxt-bytes"),
            (25284,"RuntimeAtlasTexture","EstimateTextureBytes","RuntimeAtlasTexture_EstimateTextureBytes","runtime-atlas-texture-estimate-bytes"),
            (25287,"Source","get_HasDxtCache","Source_get_HasDxtCache","source-has-dxt-cache"),
            (25290,"<>c__DisplayClass11_0","<QueueWrite>b__0","DisplayClass11_0_QueueWrite_b0","runtime-atlas-texture-queue-write-callback"),
            (25291,"RuntimeSpineLoader","DestroyOwned","RuntimeSpineLoader_DestroyOwned","runtime-spine-loader-destroy-owned"),
            (25292,"RuntimeSpineLoader","AtlasPages","RuntimeSpineLoader_AtlasPages","runtime-spine-loader-atlas-pages"),
            (25293,"RuntimeSpineLoader","Read","RuntimeSpineLoader_Read","runtime-spine-loader-read"),
            (25294,"RuntimeSpineLoader","ReadAsync","RuntimeSpineLoader_ReadAsync","runtime-spine-loader-read-async"),
            (25295,"RuntimeSpineLoader","Load","RuntimeSpineLoader_Load","runtime-spine-loader-load"),
            (25296,"RuntimeSpineLoader","Create","RuntimeSpineLoader_Create","runtime-spine-loader-create"),
            (25297,"RuntimeSpineLoader","CanLoadPngAsDxt5","RuntimeSpineLoader_CanLoadPngAsDxt5","runtime-spine-loader-can-load-png-dxt5"),
            (25300,"PageTextureLoader","Load","PageTextureLoader_Load","page-texture-loader-load"),
            (25301,"PageTextureLoader","Unload","PageTextureLoader_Unload","page-texture-loader-unload"),
            (25306,"<>c__DisplayClass4_0","<ReadAsync>b__0","DisplayClass4_0_ReadAsync_b0","runtime-spine-loader-read-async-callback"),
            (25308,"<>c__DisplayClass6_0","<Create>b__0","DisplayClass6_0_Create_b0","runtime-spine-loader-create-callback"),
            (25311,"RuntimeSpineAsset","get_HasConsumers","RuntimeSpineAsset_get_HasConsumers","runtime-spine-asset-has-consumers"),
            (25312,"RuntimeSpineAsset","get_EstimatedTextureBytes","RuntimeSpineAsset_get_EstimatedTextureBytes","runtime-spine-asset-estimated-bytes"),
            (25313,"RuntimeSpineAsset","Own","RuntimeSpineAsset_Own","runtime-spine-asset-own"),
            (25314,"RuntimeSpineAsset","Retain","RuntimeSpineAsset_Retain","runtime-spine-asset-retain"),
            (25316,"RuntimeSpineAsset","Dispose","RuntimeSpineAsset_Dispose","runtime-spine-asset-dispose"),
          ]
          rows=[]
          for index,expected_type,expected_name,function_name,stem in targets:
              method=methods[index]
              declaring=types[method["declaring_type"]]["name"]
              if declaring!=expected_type or method["name"]!=expected_name:
                  raise SystemExit(f"method identity mismatch: {index} {declaring}.{method['name']}")
              address=addresses[index]
              if address.get("state")!="code" or not address.get("rva"):
                  raise SystemExit(f"missing code pointer: {expected_type}.{expected_name}")
              entry=int(address["rva"],16)+0x100000
              rows.append((index,expected_type,expected_name,function_name,stem,entry))
          pathlib.Path("work/rea/flow-targets.tsv").write_text(
              "".join("\t".join(map(str,row))+"\n" for row in rows))
          print(json.dumps({"method_entry_count":len(entries),"targets":[
              {"index":i,"method":f"{t}.{n}","function_name":fn,"entry":hex(e)} for i,t,n,fn,s,e in rows
          ]},indent=2))
          PY

      - name: Recover reachable control-flow blocks and decompile
        shell: bash
        env:
          GHIDRA_INSTALL_DIR: ${{ github.workspace }}/tools/ghidra_12.1.4_PUBLIC
          JAVA_TOOL_OPTIONS: "-Xmx3G -XX:ActiveProcessorCount=2"
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r index type method symbol stem entry; do
            echo "Recovering $type.$method at $entry"
            PROJECT="$GITHUB_WORKSPACE/work/ghidra-project/${stem}"
            LOG="$GITHUB_WORKSPACE/work/rea/${stem}-flow-recovery.log"
            mkdir -p "$PROJECT"
            "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" \
              "$PROJECT" azurearchive-spine-flow \
              -import "$GITHUB_WORKSPACE/work/input/libil2cpp.so" \
              -noanalysis \
              -scriptPath "$GITHUB_WORKSPACE/scripts/ghidra" \
              -postScript PrepareFlowFunction.java "$entry" 6000 0x4000000 "$symbol" \
                "$GITHUB_WORKSPACE/work/rea/${stem}-flow-ghidra.c" \
                "$GITHUB_WORKSPACE/work/rea/${stem}-flow-ghidra.json" \
                "$GITHUB_WORKSPACE/work/input/all-method-entries.txt" \
              -max-cpu 2 \
              2>&1 | tee "$LOG"
            grep -q "REA_FLOW_FUNCTION_OK" "$LOG"
            test -s "$GITHUB_WORKSPACE/work/rea/${stem}-flow-ghidra.c"
            test -s "$GITHUB_WORKSPACE/work/rea/${stem}-flow-ghidra.json"
          done < work/rea/flow-targets.tsv

      - name: Verify flow recovery outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("work/rea")
          report={"format":"azurearchive-spine-flow-recovery-v1","targets":[]}
          for line in (root/"flow-targets.tsv").read_text().splitlines():
              index,typ,method,symbol,stem,entry=line.split("\t")
              code=(root/f"{stem}-flow-ghidra.c").read_text()
              meta=json.loads((root/f"{stem}-flow-ghidra.json").read_text())
              digest=hashlib.sha256(code.encode()).hexdigest()
              try:
                  actual_entry=int(meta.get("entry","0"),16)
              except (TypeError,ValueError):
                  actual_entry=-1
              if meta.get("function_name")!=symbol or actual_entry!=int(entry,10):
                  raise SystemExit(f"{typ}.{method}: identity/entry mismatch (metadata={meta.get('entry')}, expected_decimal={entry})")
              if meta.get("pseudocode_sha256")!=digest or meta.get("pseudocode_chars")!=len(code):
                  raise SystemExit(f"{typ}.{method}: pseudocode hash/length mismatch")
              report["targets"].append({
                "method":f"{typ}.{method}","function_name":symbol,"entry":entry,
                "reachable_instructions":meta.get("reachable_instruction_count"),
                "decoded_instructions":meta.get("decoded_instruction_count"),
                "decode_failures":meta.get("decode_failures"),
                "skipped_other_method_entries":meta.get("skipped_other_method_entries"),
                "pseudocode_chars":len(code),"sha256":digest,
                "status":"flow_decompiled_and_hash_verified",
                "limitations":meta.get("limits",[])
              })
          (root/"flow-recovery-verification.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload reachable-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-rea-spine-flow-recovery
          path: work/rea/
          if-no-files-found: warn
