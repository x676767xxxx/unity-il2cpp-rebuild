name: Map iOS IL2CPP methods from the actual IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-il2cpp-method-map.yml'
permissions:
  contents: read
jobs:
  map-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS release IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ios work/dumper work/out
          curl -fL --retry 3 -o work/ios/AzureArchive_IOS_0.7.9.2.ipa 'https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_IOS_0.7.9.2.ipa'
          unzip -q work/ios/AzureArchive_IOS_0.7.9.2.ipa -d work/ios/extracted
          BIN="$(find work/ios/extracted/Payload -type f -path '*/UnityFramework.framework/UnityFramework' -print -quit)"
          META="$(find work/ios/extracted/Payload -type f -name global-metadata.dat -print -quit)"
          test -n "$BIN" || { echo 'UnityFramework missing'; exit 1; }
          test -n "$META" || { echo 'global-metadata.dat missing in IPA'; find work/ios/extracted/Payload -maxdepth 8 -type f | head -150; exit 1; }
          cp "$BIN" work/ios/UnityFramework
          cp "$META" work/ios/global-metadata.dat
          file work/ios/UnityFramework work/ios/global-metadata.dat | tee work/out/input-info.txt
          ls -lh work/ios/UnityFramework work/ios/global-metadata.dat | tee -a work/out/input-info.txt
      - name: Install .NET runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Install LLVM disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
      - name: Run Il2CppDumper on the iOS Mach-O binary and matching metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o work/dumper.zip 'https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip'
          unzip -q work/dumper.zip -d work/dumper
          find work/dumper -maxdepth 2 -type f | sort | head -40
          DLL="$(find work/dumper -maxdepth 3 -type f -name Il2CppDumper.dll -print -quit)"
          test -n "$DLL" || { echo 'Il2CppDumper.dll not found'; exit 1; }
          # Il2CppDumper uses Console.ReadKey for platform selection; run it under a PTY.
          mkdir -p work/out/ios-dump
          script -q -e -c "dotnet \"$DLL\" work/ios/UnityFramework work/ios/global-metadata.dat work/out/ios-dump" /dev/null <<< "1"
          test -s work/out/ios-dump/dump.cs
          cp work/out/ios-dump/dump.cs work/out/ios-dump.cs
      - name: Install Mach-O parsing libraries
        run: python3 -m pip install --break-system-packages lief capstone
      - name: Extract actual iOS method RVAs and bounded disassembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess
          dump=pathlib.Path("work/out/ios-dump.cs").read_text(errors="replace")
          names=[
            "ScenarioResourceManager",
            "CheckForUpdate",
            "Initialize",
            "Awake",
            "OnUpdateComplete",
            "AddressableFlatBufferLoader",
            "LoadGlobalResourceOverrides",
            "GetResourceOverrideRoot",
            "UpdateAddressable",
            "UserSettings",
          ]
          hits=[]
          for i,line in enumerate(dump.splitlines()):
              if any(n in line for n in names) and ("RVA:" in line or "Offset:" in line or "ScenarioResourceManager" in line):
                  hits.append(line)
          pathlib.Path("work/out/ios-method-search.txt").write_text("\n".join(hits),encoding="utf-8")
          # Il2CppDumper's dump.cs records the iOS-specific method RVAs.
          # Keep the method map as the source of truth; never reuse Android RVAs.
          selected=[]
          lines=dump.splitlines()
          for i,line in enumerate(lines):
              if any(k in line for k in ["CheckForUpdate", "OnUpdateComplete", "AddressableFlatBufferLoader", "LoadGlobalResourceOverrides", "GetResourceOverrideRoot", "UpdateAddressable"]):
                  context="\n".join(lines[max(0,i-2):min(len(lines),i+3)])
                  if "RVA:" in context:
                      selected.append(context)
          pathlib.Path("work/out/ios-selected-method-map.txt").write_text("\n\n".join(selected),encoding="utf-8")
          print("iOS-specific IL2CPP dump generated. Method map excerpts:")
          print("\n\n".join(selected[:30]))

          # Resolve actual method RVAs from dump.cs and map them through the
          # Mach-O __text section's virtual address and file offset. Do not
          # accept llvm-objdump's first-section output as proof of a match.
          import lief
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          binary_path = pathlib.Path("work/ios/UnityFramework")
          subprocess.run(["llvm-lipo", "-thin", "arm64", str(binary_path),
                          "-output", "work/ios/UnityFramework.arm64"], check=True)
          thin_path = pathlib.Path("work/ios/UnityFramework.arm64")
          binary = lief.parse(str(thin_path))
          if binary is None:
              raise SystemExit("LIEF could not parse the thin arm64 Mach-O")
          sections = [s for s in binary.sections if s.name == "__text"]
          if not sections:
              raise SystemExit("Mach-O __text section not found")
          text_segments = [s for s in binary.segments
                           if getattr(s, "segment_name", "") == "__TEXT"
                           or getattr(s, "name", "") == "__TEXT"]
          image_base = min((int(s.virtual_address) for s in text_segments), default=0)
          print("Mach-O segments:", [(getattr(s, "name", ""),
                                      getattr(s, "segment_name", ""),
                                      hex(int(s.virtual_address)),
                                      hex(int(s.file_offset)),
                                      hex(int(s.virtual_size)),
                                      hex(int(s.file_size))) for s in binary.segments])
          print("Mach-O __text sections:", [(s.name, hex(int(s.virtual_address)),
                                               hex(int(s.offset)), hex(int(s.size)))
                                              for s in sections])
          md = Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          raw = thin_path.read_bytes()
          method_ranges = {
              "CheckForUpdate.MoveNext": (0x3D746AC, 0x3D751A0),
              "OnUpdateComplete.MoveNext": (0x3D776C0, 0x3D77BE4),
              "ScenarioResourceManager.Awake": (0x3D693C8, 0x3D69690),
              "ScenarioResourceManager.Initialize": (0x3D69690, 0x3D699A4),
          }
          results = []
          for name, (rva, end_rva) in method_ranges.items():
              mapped = None
              for sec in sections:
                  sec_va = int(sec.virtual_address)
                  sec_off = int(sec.offset)
                  sec_size = int(sec.size)
                  # Il2CppDumper's Mach-O RVA commonly corresponds to the
                  # section-relative file offset. Resolve both coordinate systems.
                  if sec_off <= rva < sec_off + sec_size:
                      off = rva
                      va = sec_va + (rva - sec_off)
                      end_off = min(end_rva, sec_off + sec_size)
                      if 0 <= off < end_off <= len(raw):
                          mapped = ("section-file-offset", va, off, end_off)
                          break
                  for mode, candidate_va in [("RVA-as-VA", rva),
                                             ("imagebase-plus-RVA", image_base+rva)]:
                      if sec_va <= candidate_va < sec_va + sec_size:
                          off = sec_off + (candidate_va-sec_va)
                          end_va = min(candidate_va + (end_rva-rva), sec_va+sec_size)
                          end_off = off + (end_va-candidate_va)
                          if 0 <= off < end_off <= len(raw):
                              mapped = (mode, candidate_va, off, end_off)
                              break
                  if mapped:
                      break
              if not mapped:
                  raise SystemExit(f"{name}: RVA {rva:#x} did not map into Mach-O __text; imagebase={image_base:#x}")
              mode, va, off, end_off = mapped
              code = raw[off:end_off]
              insns = list(md.disasm(code, va))
              if len(insns) < 10 or insns[0].address != va:
                  raise SystemExit(f"{name}: insufficient valid ARM64 instructions at {va:#x}")
              results.append(f"## {name}\\nmode={mode}\\nRVA={rva:#x}\\nVA={va:#x}\\nfile_offset={off:#x}\\n")
              results.extend(f"{i.address:#x}:\\t{i.mnemonic}\\t{i.op_str}" for i in insns)
              results.append("")
          pathlib.Path("work/out/ios-native-method-disassembly.txt").write_text(
              "\\n".join(results), encoding="utf-8"
          )
          print("Verified ARM64 disassembly mapped into Mach-O __text.")
          print("\\n".join(results)[:20000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: azurearchive-ios-il2cpp-method-map
          path: work/out/
