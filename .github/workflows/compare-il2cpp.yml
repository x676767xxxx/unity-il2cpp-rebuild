name: Compare AzureArchive IL2CPP platforms
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        run: |
          mkdir -p work/{ios,android,windows,tools,out}
          curl -fL --retry 3 -o work/ios/app.ipa "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_IOS_0.7.9.2.ipa"
          curl -fL --retry 3 -o work/windows/app.zip "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/AzureArchive_Win_1.0.1.zip"
          curl -fL --retry 3 -o work/android/app.apk "https://github.com/x676767xxxx/unity-il2cpp-rebuild/releases/download/XR1/base.apk"
          unzip -q work/ios/app.ipa -d work/ios/extracted
          unzip -q work/windows/app.zip -d work/windows/extracted
          unzip -q work/android/app.apk -d work/android/extracted
      - name: Inventory native binaries and metadata
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, subprocess
          roots = {"iOS": pathlib.Path("work/ios/extracted"), "Android": pathlib.Path("work/android/extracted"), "Windows": pathlib.Path("work/windows/extracted")}
          out=[]
          for platform, root in roots.items():
              out.append("## "+platform)
              for p in root.rglob("*"):
                  if not p.is_file(): continue
                  if p.name.lower() in {"unityframework","gameassembly.dll","libil2cpp.so","global-metadata.dat"}:
                      b=p.read_bytes()
                      out.append(f"{p} | bytes={len(b)} | sha256={hashlib.sha256(b).hexdigest()} | "+subprocess.run(["file",str(p)],capture_output=True,text=True).stdout.strip())
          pathlib.Path("work/out/native-inventory.txt").write_text("\n".join(out))
          PY
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: azurearchive-native-inventory
          path: work/out/native-inventory.txt
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Download IL2CPP Dumper
        run: |
          curl -fL --retry 3 -o work/tools/dumper.zip https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip
          unzip -q work/tools/dumper.zip -d work/tools/dumper
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("work/tools/dumper/config.json")
          c=json.loads(p.read_text())
          c["RequireAnyKey"]=False
          p.write_text(json.dumps(c))
          PY
      - name: Dump iOS ARM64 Mach-O
        run: |
          DUMPER="$PWD/work/tools/dumper/Il2CppDumper.dll"
          BIN=$(find work/ios/extracted -type f -name UnityFramework | head -1)
          META=$(find work/ios/extracted -type f -name global-metadata.dat | head -1)
          mkdir -p work/out/dump-ios
          echo "iOS binary=$BIN metadata=$META" > work/out/ios-dumper.log
          printf '1' | script -q -c "dotnet '$DUMPER' '$BIN' '$META' '$PWD/work/out/dump-ios'" /dev/null >> work/out/ios-dumper.log 2>&1
          find work/out/dump-ios -maxdepth 2 -type f -printf '%p %s bytes\n' >> work/out/ios-dumper.log
      - name: Dump Android ARM64 and Windows x64
        run: |
          DUMPER="$PWD/work/tools/dumper/Il2CppDumper.dll"
          ANDROID_BIN=$(find work/android/extracted/lib/arm64-v8a -type f -name libil2cpp.so | head -1)
          ANDROID_META=$(find work/android/extracted -type f -name global-metadata.dat | head -1)
          WINDOWS_BIN=$(find work/windows/extracted -type f -name GameAssembly.dll | head -1)
          WINDOWS_META=$(find work/windows/extracted -type f -name global-metadata.dat | head -1)
          mkdir -p work/out/dump-android-arm64 work/out/dump-windows
          dotnet "$DUMPER" "$ANDROID_BIN" "$ANDROID_META" "$PWD/work/out/dump-android-arm64" > work/out/android-dumper.log 2>&1 || true
          dotnet "$DUMPER" "$WINDOWS_BIN" "$WINDOWS_META" "$PWD/work/out/dump-windows" > work/out/windows-dumper.log 2>&1 || true
      - name: Compare application types and methods
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("work/out")
          def parse(path):
              s=path.read_text(errors="ignore")
              ns=""; types=set()
              for line in s.splitlines():
                  m=re.match(r'// Namespace:\\s*(.*)',line)
                  if m: ns=m.group(1).strip()
                  m=re.search(r'\\b(class|struct|enum|interface)\\s+([^ :{]+)',line)
                  if m:
                      name=m.group(2); types.add((ns+"." if ns else "")+name)
              return types
          paths={k:root/f"dump-{k}"/"dump.cs" for k in ["ios","android-arm64","windows"]}
          report=[]
          sets={}
          for k,p in paths.items():
              if p.exists():
                  sets[k]=parse(p)
                  report.append(f"{k}: extracted type declarations={len(sets[k])}")
              else: report.append(f"{k}: dump.cs NOT FOUND")
          for a,b in [("ios","android-arm64"),("ios","windows"),("android-arm64","windows")]:
              if a in sets and b in sets:
                  aa,bb=sets[a],sets[b]
                  report.append(f"\n{a} only ({len(aa-bb)}):")
                  report.extend(sorted(aa-bb)[:250])
                  report.append(f"\n{b} only ({len(bb-aa)}):")
                  report.extend(sorted(bb-aa)[:250])
          (root/"type-comparison.txt").write_text("\n".join(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: azurearchive-ios-il2cpp-comparison
          path: work/out/
